<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha Neon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --neon-main: #00f7ff;
      --neon-x: #ffee00;
      --neon-o: #ff00cc;
      --neon-border: #0066ff;
      --neon-cell: #0044aa;
      --neon-win: #ff00aa;
      --neon-title: #00f7ff;
      --neon-sub: #ff00aa;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0d1a;
      background-image: 
        linear-gradient(rgba(15, 15, 35, 0.92), rgba(15, 15, 35, 0.92)),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(40, 40, 80, 0.25) 40px, rgba(40, 40, 80, 0.25) 42px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(40, 40, 80, 0.25) 40px, rgba(40, 40, 80, 0.25) 42px);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      padding: 15px;
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 4px;
      color: var(--neon-title);
      text-shadow: 0 0 5px var(--neon-title), 0 0 12px var(--neon-title), 0 0 25px var(--neon-title);
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--neon-sub);
      text-shadow: 0 0 8px var(--neon-sub);
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    /* ===== SETUP ===== */
    .setup {
      background: rgba(10, 15, 40, 0.7);
      border: 2px solid #0044aa;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 0 15px rgba(0, 80, 200, 0.3);
    }

    .mode-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 6px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 2px solid #0066ff;
      border-radius: 10px;
      background: transparent;
      color: #88ccff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #0066ff, #00aaff);
      color: #fff;
      box-shadow: 0 0 12px #0066ff;
    }

    .mode-btn:hover:not(.active) {
      background: rgba(0, 80, 200, 0.3);
    }

    .names {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 4px;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name-row label {
      width: 90px;
      text-align: right;
      font-size: 0.9rem;
      color: #aaddff;
    }

    .name-row input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #0044aa;
      background: rgba(5, 10, 30, 0.8);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .name-row input:focus {
      border-color: #00aaff;
      box-shadow: 0 0 8px rgba(0, 170, 255, 0.5);
    }

    .name-row input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      justify-content: center;
    }

    .volume-control label {
      font-size: 0.9rem;
      color: #aaddff;
      white-space: nowrap;
    }

    .volume-control input[type="range"] {
      width: 120px;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #003366;
      border-radius: 5px;
      outline: none;
    }

    .volume-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #00aaff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px #00aaff;
    }

    .volume-control input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #00aaff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px #00aaff;
    }

    #volumeValue {
      font-size: 0.85rem;
      color: #00f7ff;
      min-width: 36px;
      text-align: left;
    }

    .mute-btn {
      background: none;
      border: 2px solid #0044aa;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      transition: all 0.2s;
    }

    .mute-btn:hover {
      border-color: #00aaff;
      box-shadow: 0 0 8px #00aaff;
    }

    .mute-btn.muted {
      opacity: 0.5;
      filter: grayscale(1);
    }

    .theme-control, .diff-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      justify-content: center;
    }

    .theme-control label, .diff-control label {
      font-size: 0.9rem;
      color: #aaddff;
    }

    .theme-btns {
      display: flex;
      gap: 6px;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 2px solid #0044aa;
      background: rgba(0,20,50,0.6);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: #00aaff;
    }

    .theme-btn.active {
      border-color: #00f7ff;
      box-shadow: 0 0 10px #00f7ff;
      background: rgba(0, 80, 150, 0.5);
    }

    .diff-control select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 2px solid #0044aa;
      background: rgba(5, 10, 30, 0.8);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .diff-control select:focus {
      border-color: #00aaff;
    }

    /* ===== PLACAR ===== */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 20, 50, 0.6);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid #003388;
    }

    .score-box {
      text-align: center;
    }

    .score-box .label {
      font-size: 0.8rem;
      color: #88aacc;
      margin-bottom: 2px;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score-box .points {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .score-box.p1 .points {
      color: #ffee00;
      text-shadow: 0 0 10px #ffee00;
    }

    .score-box.p2 .points {
      color: #ff00cc;
      text-shadow: 0 0 10px #ff00cc;
    }

    /* ===== BOARD ===== */
    .board-wrapper {
      position: relative;
      display: inline-block;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 85px);
      grid-template-rows: repeat(3, 85px);
      gap: 7px;
      background: #050510;
      padding: 10px;
      border-radius: 12px;
      border: 3px solid var(--neon-border);
      box-shadow: 0 0 15px var(--neon-border), 0 0 30px color-mix(in srgb, var(--neon-border) 35%, transparent);
    }

    .cell {
      background: rgba(10, 15, 40, 0.85);
      border: 2px solid var(--neon-cell);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.9rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: inset 0 0 12px color-mix(in srgb, var(--neon-cell) 40%, transparent);
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: rgba(0, 40, 100, 0.55);
      box-shadow: inset 0 0 15px color-mix(in srgb, var(--neon-main) 50%, transparent);
    }

    .cell.x {
      color: var(--neon-x);
      text-shadow: 0 0 8px var(--neon-x), 0 0 16px var(--neon-x), 0 0 28px var(--neon-x);
    }

    .cell.o {
      color: var(--neon-o);
      text-shadow: 0 0 8px var(--neon-o), 0 0 16px var(--neon-o), 0 0 28px var(--neon-o);
    }

    .cell.win {
      background: rgba(0, 80, 150, 0.7);
      animation: pulse 0.7s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: inset 0 0 18px rgba(0, 200, 255, 0.5), 0 0 12px #00ccff; }
      to   { box-shadow: inset 0 0 28px rgba(0, 255, 255, 0.85), 0 0 22px #00ffff; }
    }

    .win-line {
      position: absolute;
      background: var(--neon-win);
      height: 6px;
      border-radius: 3px;
      box-shadow: 0 0 8px var(--neon-win), 0 0 18px var(--neon-win), 0 0 30px var(--neon-win);
      transform-origin: center;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .win-line.show { opacity: 1; }

    #status {
      margin-top: 16px;
      font-size: 1.15rem;
      min-height: 1.6em;
      color: #00f7ff;
      text-shadow: 0 0 8px #00f7ff;
      font-weight: 600;
    }

    #status.win {
      color: #ff00cc;
      text-shadow: 0 0 10px #ff00cc, 0 0 20px #ff00aa;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0066ff, #00aaff);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 10px #0066ff;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 16px #00aaff;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #444, #666);
      box-shadow: 0 0 8px #555;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 400px) {
      .board {
        grid-template-columns: repeat(3, 72px);
        grid-template-rows: repeat(3, 72px);
      }
      .cell { font-size: 2.4rem; }
      h1 { font-size: 1.6rem; }
      .name-row label { width: 75px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JOGO DA VELHA</h1>
    <p class="subtitle">✦ Neon Edition ✦</p>

    <!-- SETUP -->
    <div class="setup">
      <div class="mode-btns">
        <button class="mode-btn active" id="btnFriend" onclick="setMode('friend')">👥 Com Amigo</button>
        <button class="mode-btn" id="btnAI" onclick="setMode('ai')">🤖 Contra IA</button>
      </div>

      <div class="names">
        <div class="name-row">
          <label>Jogador 1:</label>
          <input type="text" id="name1" value="Jogador 1" maxlength="12" placeholder="Nome">
        </div>
        <div class="name-row" id="row2">
          <label>Jogador 2:</label>
          <input type="text" id="name2" value="Jogador 2" maxlength="12" placeholder="Nome">
        </div>
      </div>

      <!-- Controle de Volume + Mute -->
      <div class="volume-control">
        <button class="mute-btn" id="muteBtn" onclick="toggleMute()" title="Ligar/Desligar som">🔊</button>
        <label>Volume:</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="70" oninput="updateVolume(this.value)">
        <span id="volumeValue">70%</span>
      </div>

      <!-- Temas de cores -->
      <div class="theme-control">
        <label>Tema:</label>
        <div class="theme-btns">
          <button class="theme-btn active" data-theme="original" onclick="setTheme('original')" title="Original">💙</button>
          <button class="theme-btn" data-theme="verde" onclick="setTheme('verde')" title="Verde">💚</button>
          <button class="theme-btn" data-theme="roxo" onclick="setTheme('roxo')" title="Roxo">💜</button>
          <button class="theme-btn" data-theme="laranja" onclick="setTheme('laranja')" title="Laranja">🧡</button>
        </div>
      </div>

      <!-- Dificuldade da IA (só aparece no modo IA) -->
      <div class="diff-control" id="diffControl" style="display: none;">
        <label>IA:</label>
        <select id="aiDifficulty" onchange="setDifficulty(this.value)">
          <option value="easy">Fácil</option>
          <option value="medium" selected>Médio</option>
          <option value="hard">Difícil</option>
        </select>
      </div>
    </div>

    <!-- PLACAR -->
    <div class="scoreboard">
      <div class="score-box p1">
        <div class="label" id="label1">Jogador 1</div>
        <div class="points" id="score1">0</div>
      </div>
      <div class="score-box p2">
        <div class="label" id="label2">Jogador 2</div>
        <div class="points" id="score2">0</div>
      </div>
    </div>

    <!-- TABULEIRO -->
    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <div class="win-line" id="winLine"></div>
    </div>

    <p id="status">Vez de <span style="color:#ffee00">Jogador 1</span></p>

    <div class="buttons">
      <button class="btn" onclick="novaPartida()">Nova Partida</button>
      <button class="btn secondary" onclick="resetScore()">Zerar Placar</button>
    </div>
  </div>

  <script>
    // ===== VARIÁVEIS =====
    let mode = 'friend'; // 'friend' ou 'ai'
    let gameBoard = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X'; // X = Jogador 1, O = Jogador 2 / IA
    let gameActive = true;
    let score = { X: 0, O: 0 };

    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const winLine = document.getElementById('winLine');
    const name1Input = document.getElementById('name1');
    const name2Input = document.getElementById('name2');
    const label1 = document.getElementById('label1');
    const label2 = document.getElementById('label2');
    const score1El = document.getElementById('score1');
    const score2El = document.getElementById('score2');

    // ===== SONS (Web Audio API) =====
    let audioCtx = null;
    let masterVolume = 0.7; // 0.0 a 1.0
    let soundEnabled = true;
    let aiDifficulty = 'medium'; // easy | medium | hard

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function updateVolume(value) {
      masterVolume = value / 100;
      document.getElementById('volumeValue').textContent = value + '%';
      if (masterVolume > 0 && !soundEnabled) {
        soundEnabled = true;
        document.getElementById('muteBtn').textContent = '🔊';
        document.getElementById('muteBtn').classList.remove('muted');
      }
    }

    function toggleMute() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('muteBtn');
      if (soundEnabled) {
        btn.textContent = '🔊';
        btn.classList.remove('muted');
        if (masterVolume === 0) {
          masterVolume = 0.7;
          document.getElementById('volumeSlider').value = 70;
          document.getElementById('volumeValue').textContent = '70%';
        }
        playClickSound();
      } else {
        btn.textContent = '🔇';
        btn.classList.add('muted');
      }
    }

    // ===== TEMAS =====
    const themes = {
      original: {
        '--neon-main': '#00f7ff',
        '--neon-x': '#ffee00',
        '--neon-o': '#ff00cc',
        '--neon-border': '#0066ff',
        '--neon-cell': '#0044aa',
        '--neon-win': '#ff00aa',
        '--neon-title': '#00f7ff',
        '--neon-sub': '#ff00aa'
      },
      verde: {
        '--neon-main': '#00ff88',
        '--neon-x': '#aaff00',
        '--neon-o': '#00ffcc',
        '--neon-border': '#00aa55',
        '--neon-cell': '#007744',
        '--neon-win': '#00ffaa',
        '--neon-title': '#00ff88',
        '--neon-sub': '#aaff00'
      },
      roxo: {
        '--neon-main': '#cc66ff',
        '--neon-x': '#ff66cc',
        '--neon-o': '#9966ff',
        '--neon-border': '#8800cc',
        '--neon-cell': '#660099',
        '--neon-win': '#ff00ff',
        '--neon-title': '#cc66ff',
        '--neon-sub': '#ff66cc'
      },
      laranja: {
        '--neon-main': '#ff9900',
        '--neon-x': '#ffee00',
        '--neon-o': '#ff5500',
        '--neon-border': '#cc6600',
        '--neon-cell': '#994400',
        '--neon-win': '#ff3300',
        '--neon-title': '#ff9900',
        '--neon-sub': '#ff5500'
      }
    };

    function setTheme(name) {
      playClickSound();
      const theme = themes[name];
      if (!theme) return;
      for (const [key, value] of Object.entries(theme)) {
        document.documentElement.style.setProperty(key, value);
      }
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === name);
      });
    }

    function setDifficulty(value) {
      aiDifficulty = value;
      playClickSound();
    }

    // Clique / colocar peça
    function playPlaceSound(isX) {
      if (!soundEnabled || masterVolume <= 0) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(isX ? 520 : 380, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(isX ? 380 : 280, audioCtx.currentTime + 0.12);

      const vol = 0.18 * masterVolume;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Vitória
    function playWinSound() {
      if (!soundEnabled || masterVolume <= 0) return;
      initAudio();
      const notes = [523, 659, 784, 1046]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'triangle';
        osc.frequency.value = freq;

        const start = audioCtx.currentTime + i * 0.12;
        const vol = 0.2 * masterVolume;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(vol, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);

        osc.start(start);
        osc.stop(start + 0.35);
      });
    }

    // Limpar tabuleiro
    function playClearSound() {
      if (!soundEnabled || masterVolume <= 0) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);

      const vol = 0.12 * masterVolume;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // Clique de botão
    function playClickSound() {
      if (!soundEnabled || masterVolume <= 0) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.type = 'square';
      osc.frequency.value = 800;
      const vol = 0.08 * masterVolume;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.06);
    }

    // Fala o nome de quem venceu
    function speakWinner(name) {
      if (!soundEnabled) return;
      if (!('speechSynthesis' in window)) return;

      // Cancela qualquer fala anterior
      speechSynthesis.cancel();

      const frase = `${name} venceu!`;
      const utterance = new SpeechSynthesisUtterance(frase);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.05;
      utterance.pitch = 1.15;
      utterance.volume = masterVolume;

      speechSynthesis.speak(utterance);
    }

    const winPatterns = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    const lineStyles = [
      { top:'16%', left:'12%', width:'76%', transform:'rotate(0deg)' },
      { top:'50%', left:'12%', width:'76%', transform:'rotate(0deg)' },
      { top:'84%', left:'12%', width:'76%', transform:'rotate(0deg)' },
      { top:'12%', left:'16%', width:'76%', transform:'rotate(90deg)' },
      { top:'12%', left:'50%', width:'76%', transform:'rotate(90deg)' },
      { top:'12%', left:'84%', width:'76%', transform:'rotate(90deg)' },
      { top:'50%', left:'12%', width:'76%', transform:'rotate(45deg)' },
      { top:'50%', left:'12%', width:'76%', transform:'rotate(-45deg)' }
    ];

    // ===== EVENTOS =====
    cells.forEach(cell => cell.addEventListener('click', handleClick));
    name1Input.addEventListener('input', updateLabels);
    name2Input.addEventListener('input', updateLabels);

    // ===== FUNÇÕES =====
    function setMode(newMode) {
      playClickSound();
      mode = newMode;
      document.getElementById('btnFriend').classList.toggle('active', mode === 'friend');
      document.getElementById('btnAI').classList.toggle('active', mode === 'ai');

      const diffControl = document.getElementById('diffControl');
      if (mode === 'ai') {
        name2Input.value = 'IA';
        name2Input.disabled = true;
        document.getElementById('row2').style.opacity = '0.6';
        if (diffControl) diffControl.style.display = 'flex';
      } else {
        if (name2Input.value === 'IA') name2Input.value = 'Jogador 2';
        name2Input.disabled = false;
        document.getElementById('row2').style.opacity = '1';
        if (diffControl) diffControl.style.display = 'none';
      }
      updateLabels();
      resetRound();
    }

    function getName(player) {
      if (player === 'X') return name1Input.value.trim() || 'Jogador 1';
      return name2Input.value.trim() || (mode === 'ai' ? 'IA' : 'Jogador 2');
    }

    function updateLabels() {
      label1.textContent = getName('X');
      label2.textContent = getName('O');
      updateStatus();
    }

    function updateStatus() {
      if (!gameActive) return;
      const name = getName(currentPlayer);
      const color = currentPlayer === 'X' ? '#ffee00' : '#ff00cc';
      statusEl.innerHTML = `Vez de <span style="color:${color};text-shadow:0 0 8px ${color}">${name}</span>`;
      statusEl.classList.remove('win');
    }

    function handleClick(e) {
      const index = parseInt(e.target.dataset.index);
      if (gameBoard[index] !== '' || !gameActive) return;
      if (mode === 'ai' && currentPlayer === 'O') return;

      makeMove(index);
    }

    function makeMove(index) {
      gameBoard[index] = currentPlayer;
      cells[index].textContent = currentPlayer;
      cells[index].classList.add(currentPlayer.toLowerCase(), 'taken');

      // Som de colocar peça
      playPlaceSound(currentPlayer === 'X');

      if (checkWin()) {
        const winnerName = getName(currentPlayer);
        const color = currentPlayer === 'X' ? '#ffee00' : '#ff00cc';
        statusEl.innerHTML = `<span style="color:${color}">${winnerName}</span> venceu! 🎉`;
        statusEl.classList.add('win');
        score[currentPlayer]++;
        updateScoreDisplay();
        gameActive = false;
        playWinSound();          // Som musical de vitória
        speakWinner(winnerName); // Fala o nome de quem ganhou
        return;
      }

      // SE O TABULEIRO ENCHEU → mostra mensagem e depois apaga tudo (sem empate)
      if (gameBoard.every(c => c !== '')) {
        statusEl.innerHTML = 'Tabuleiro cheio! Limpando... ✨';
        statusEl.style.color = '#ffaa00';
        statusEl.style.textShadow = '0 0 10px #ffaa00';
        gameActive = false; // trava cliques enquanto limpa
        playClearSound(); // Som de limpar

        setTimeout(() => {
          clearBoardAndContinue();
        }, 900);
        return;
      }

      // Troca de jogador
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();

      // Vez da IA
      if (mode === 'ai' && currentPlayer === 'O' && gameActive) {
        setTimeout(aiMove, 450);
      }
    }

    function clearBoardAndContinue() {
      // Apaga todos os X e O, libera os espaços
      gameBoard = ['', '', '', '', '', '', '', '', ''];
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('x', 'o', 'taken', 'win');
      });
      winLine.classList.remove('show');

      // Continua o jogo normalmente
      gameActive = true;
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();

      // Se for a vez da IA, ela joga
      if (mode === 'ai' && currentPlayer === 'O' && gameActive) {
        setTimeout(aiMove, 500);
      }
    }

    function checkWin() {
      for (let i = 0; i < winPatterns.length; i++) {
        const [a, b, c] = winPatterns[i];
        if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
          cells[a].classList.add('win');
          cells[b].classList.add('win');
          cells[c].classList.add('win');

          const s = lineStyles[i];
          winLine.style.top = s.top;
          winLine.style.left = s.left;
          winLine.style.width = s.width;
          winLine.style.transform = s.transform;
          winLine.classList.add('show');
          return true;
        }
      }
      return false;
    }

    function updateScoreDisplay() {
      score1El.textContent = score.X;
      score2El.textContent = score.O;
    }

    function resetRound() {
      gameBoard = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;

      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('x', 'o', 'taken', 'win');
      });
      winLine.classList.remove('show');
      statusEl.classList.remove('win');
      updateStatus();
    }

    function resetScore() {
      playClickSound();
      score = { X: 0, O: 0 };
      updateScoreDisplay();
      resetRound();
    }

    // Função chamada pelos botões (com som)
    function novaPartida() {
      playClickSound();
      resetRound();
    }

    // ===== INTELIGÊNCIA ARTIFICIAL =====
    function aiMove() {
      if (!gameActive) return;

      let move = -1;

      if (aiDifficulty === 'easy') {
        // Fácil: quase sempre joga aleatório, às vezes bloqueia
        if (Math.random() < 0.3) {
          move = findBestMove('X'); // às vezes bloqueia
        }
        if (move === -1) {
          const empty = gameBoard.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);
          move = empty[Math.floor(Math.random() * empty.length)];
        }
      } 
      else if (aiDifficulty === 'medium') {
        // Médio: tenta ganhar, bloqueia, depois centro/cantos
        move = findBestMove('O');
        if (move === -1) move = findBestMove('X');
        if (move === -1 && gameBoard[4] === '') move = 4;
        if (move === -1) {
          const corners = [0, 2, 6, 8].filter(i => gameBoard[i] === '');
          if (corners.length) move = corners[Math.floor(Math.random() * corners.length)];
        }
        if (move === -1) {
          const empty = gameBoard.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);
          move = empty[Math.floor(Math.random() * empty.length)];
        }
      } 
      else {
        // Difícil: joga o melhor possível (quase perfeito)
        move = findBestMove('O');
        if (move === -1) move = findBestMove('X');
        if (move === -1 && gameBoard[4] === '') move = 4;
        if (move === -1) {
          // Prefere cantos, depois laterais
          const corners = [0, 2, 6, 8].filter(i => gameBoard[i] === '');
          if (corners.length) {
            move = corners[Math.floor(Math.random() * corners.length)];
          } else {
            const sides = [1, 3, 5, 7].filter(i => gameBoard[i] === '');
            if (sides.length) move = sides[Math.floor(Math.random() * sides.length)];
          }
        }
      }

      if (move !== -1 && move !== undefined) {
        makeMove(move);
      }
    }

    function findBestMove(player) {
      for (let i = 0; i < winPatterns.length; i++) {
        const [a, b, c] = winPatterns[i];
        const line = [gameBoard[a], gameBoard[b], gameBoard[c]];
        const count = line.filter(v => v === player).length;
        const empty = line.filter(v => v === '').length;

        if (count === 2 && empty === 1) {
          if (gameBoard[a] === '') return a;
          if (gameBoard[b] === '') return b;
          if (gameBoard[c] === '') return c;
        }
      }
      return -1;
    }

    // Inicia
    updateLabels();
  </script>
</body>
</html>
