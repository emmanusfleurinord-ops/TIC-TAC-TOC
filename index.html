<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha Neon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0d1a;
      background-image: 
        linear-gradient(rgba(15, 15, 35, 0.92), rgba(15, 15, 35, 0.92)),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(40, 40, 80, 0.25) 40px, rgba(40, 40, 80, 0.25) 42px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(40, 40, 80, 0.25) 40px, rgba(40, 40, 80, 0.25) 42px);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      padding: 15px;
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 4px;
      color: #00f7ff;
      text-shadow: 0 0 5px #00f7ff, 0 0 12px #00f7ff, 0 0 25px #0099ff;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #ff00aa;
      text-shadow: 0 0 8px #ff00aa;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    /* ===== SETUP ===== */
    .setup {
      background: rgba(10, 15, 40, 0.7);
      border: 2px solid #0044aa;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 0 15px rgba(0, 80, 200, 0.3);
    }

    .mode-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 6px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 2px solid #0066ff;
      border-radius: 10px;
      background: transparent;
      color: #88ccff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #0066ff, #00aaff);
      color: #fff;
      box-shadow: 0 0 12px #0066ff;
    }

    .mode-btn:hover:not(.active) {
      background: rgba(0, 80, 200, 0.3);
    }

    .names {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 4px;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name-row label {
      width: 90px;
      text-align: right;
      font-size: 0.9rem;
      color: #aaddff;
    }

    .name-row input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #0044aa;
      background: rgba(5, 10, 30, 0.8);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .name-row input:focus {
      border-color: #00aaff;
      box-shadow: 0 0 8px rgba(0, 170, 255, 0.5);
    }

    .name-row input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== PLACAR ===== */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 20, 50, 0.6);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid #003388;
    }

    .score-box {
      text-align: center;
    }

    .score-box .label {
      font-size: 0.8rem;
      color: #88aacc;
      margin-bottom: 2px;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score-box .points {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .score-box.p1 .points {
      color: #ffee00;
      text-shadow: 0 0 10px #ffee00;
    }

    .score-box.p2 .points {
      color: #ff00cc;
      text-shadow: 0 0 10px #ff00cc;
    }

    /* ===== BOARD ===== */
    .board-wrapper {
      position: relative;
      display: inline-block;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 85px);
      grid-template-rows: repeat(3, 85px);
      gap: 7px;
      background: #050510;
      padding: 10px;
      border-radius: 12px;
      border: 3px solid #0066ff;
      box-shadow: 0 0 15px #0066ff, 0 0 30px rgba(0, 100, 255, 0.35);
    }

    .cell {
      background: rgba(10, 15, 40, 0.85);
      border: 2px solid #0044aa;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.9rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: inset 0 0 12px rgba(0, 80, 200, 0.3);
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: rgba(0, 40, 100, 0.55);
      box-shadow: inset 0 0 15px rgba(0, 150, 255, 0.5);
    }

    .cell.x {
      color: #ffee00;
      text-shadow: 0 0 8px #ffee00, 0 0 16px #ffee00, 0 0 28px #ffaa00;
    }

    .cell.o {
      color: #ff00cc;
      text-shadow: 0 0 8px #ff00cc, 0 0 16px #ff00cc, 0 0 28px #ff0088;
    }

    .cell.win {
      background: rgba(0, 80, 150, 0.7);
      animation: pulse 0.7s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: inset 0 0 18px rgba(0, 200, 255, 0.5), 0 0 12px #00ccff; }
      to   { box-shadow: inset 0 0 28px rgba(0, 255, 255, 0.85), 0 0 22px #00ffff; }
    }

    .win-line {
      position: absolute;
      background: #ff00aa;
      height: 6px;
      border-radius: 3px;
      box-shadow: 0 0 8px #ff00aa, 0 0 18px #ff00aa, 0 0 30px #ff0088;
      transform-origin: center;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .win-line.show { opacity: 1; }

    #status {
      margin-top: 16px;
      font-size: 1.15rem;
      min-height: 1.6em;
      color: #00f7ff;
      text-shadow: 0 0 8px #00f7ff;
      font-weight: 600;
    }

    #status.win {
      color: #ff00cc;
      text-shadow: 0 0 10px #ff00cc, 0 0 20px #ff00aa;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0066ff, #00aaff);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 10px #0066ff;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 16px #00aaff;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #444, #666);
      box-shadow: 0 0 8px #555;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 400px) {
      .board {
        grid-template-columns: repeat(3, 72px);
        grid-template-rows: repeat(3, 72px);
      }
      .cell { font-size: 2.4rem; }
      h1 { font-size: 1.6rem; }
      .name-row label { width: 75px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JOGO DA VELHA</h1>
    <p class="subtitle">✦ Neon Edition ✦</p>

    <!-- SETUP -->
    <div class="setup">
      <div class="mode-btns">
        <button class="mode-btn active" id="btnFriend" onclick="setMode('friend')">👥 Com Amigo</button>
        <button class="mode-btn" id="btnAI" onclick="setMode('ai')">🤖 Contra IA</button>
      </div>

      <div class="names">
        <div class="name-row">
          <label>Jogador 1:</label>
          <input type="text" id="name1" value="Jogador 1" maxlength="12" placeholder="Nome">
        </div>
        <div class="name-row" id="row2">
          <label>Jogador 2:</label>
          <input type="text" id="name2" value="Jogador 2" maxlength="12" placeholder="Nome">
        </div>
      </div>
    </div>

    <!-- PLACAR -->
    <div class="scoreboard">
      <div class="score-box p1">
        <div class="label" id="label1">Jogador 1</div>
        <div class="points" id="score1">0</div>
      </div>
      <div class="score-box p2">
        <div class="label" id="label2">Jogador 2</div>
        <div class="points" id="score2">0</div>
      </div>
    </div>

    <!-- TABULEIRO -->
    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <div class="win-line" id="winLine"></div>
    </div>

    <p id="status">Vez de <span style="color:#ffee00">Jogador 1</span></p>

    <div class="buttons">
      <button class="btn" onclick="resetRound()">Nova Partida</button>
      <button class="btn secondary" onclick="resetScore()">Zerar Placar</button>
    </div>
  </div>

  <script>
    // ===== VARIÁVEIS =====
    let mode = 'friend'; // 'friend' ou 'ai'
    let gameBoard = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X'; // X = Jogador 1, O = Jogador 2 / IA
    let gameActive = true;
    let score = { X: 0, O: 0 };

    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const winLine = document.getElementById('winLine');
    const name1Input = document.getElementById('name1');
    const name2Input = document.getElementById('name2');
    const label1 = document.getElementById('label1');
    const label2 = document.getElementById('label2');
    const score1El = document.getElementById('score1');
    const score2El = document.getElementById('score2');

    const winPatterns = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    const lineStyles = [
      { top:'16%', left:'12%', width:'76%', transform:'rotate(0deg)' },
      { top:'50%', left:'12%', width:'76%', transform:'rotate(0deg)' },
      { top:'84%', left:'12%', width:'76%', transform:'rotate(0deg)' },
      { top:'12%', left:'16%', width:'76%', transform:'rotate(90deg)' },
      { top:'12%', left:'50%', width:'76%', transform:'rotate(90deg)' },
      { top:'12%', left:'84%', width:'76%', transform:'rotate(90deg)' },
      { top:'50%', left:'12%', width:'76%', transform:'rotate(45deg)' },
      { top:'50%', left:'12%', width:'76%', transform:'rotate(-45deg)' }
    ];

    // ===== EVENTOS =====
    cells.forEach(cell => cell.addEventListener('click', handleClick));
    name1Input.addEventListener('input', updateLabels);
    name2Input.addEventListener('input', updateLabels);

    // ===== FUNÇÕES =====
    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btnFriend').classList.toggle('active', mode === 'friend');
      document.getElementById('btnAI').classList.toggle('active', mode === 'ai');

      if (mode === 'ai') {
        name2Input.value = 'IA';
        name2Input.disabled = true;
        document.getElementById('row2').style.opacity = '0.6';
      } else {
        if (name2Input.value === 'IA') name2Input.value = 'Jogador 2';
        name2Input.disabled = false;
        document.getElementById('row2').style.opacity = '1';
      }
      updateLabels();
      resetRound();
    }

    function getName(player) {
      if (player === 'X') return name1Input.value.trim() || 'Jogador 1';
      return name2Input.value.trim() || (mode === 'ai' ? 'IA' : 'Jogador 2');
    }

    function updateLabels() {
      label1.textContent = getName('X');
      label2.textContent = getName('O');
      updateStatus();
    }

    function updateStatus() {
      if (!gameActive) return;
      const name = getName(currentPlayer);
      const color = currentPlayer === 'X' ? '#ffee00' : '#ff00cc';
      statusEl.innerHTML = `Vez de <span style="color:${color};text-shadow:0 0 8px ${color}">${name}</span>`;
      statusEl.classList.remove('win');
    }

    function handleClick(e) {
      const index = parseInt(e.target.dataset.index);
      if (gameBoard[index] !== '' || !gameActive) return;
      if (mode === 'ai' && currentPlayer === 'O') return;

      makeMove(index);
    }

    function makeMove(index) {
      gameBoard[index] = currentPlayer;
      cells[index].textContent = currentPlayer;
      cells[index].classList.add(currentPlayer.toLowerCase(), 'taken');

      if (checkWin()) {
        const winnerName = getName(currentPlayer);
        const color = currentPlayer === 'X' ? '#ffee00' : '#ff00cc';
        statusEl.innerHTML = `<span style="color:${color}">${winnerName}</span> venceu! 🎉`;
        statusEl.classList.add('win');
        score[currentPlayer]++;
        updateScoreDisplay();
        gameActive = false;
        return;
      }

      // SE O TABULEIRO ENCHEU → mostra mensagem e depois apaga tudo (sem empate)
      if (gameBoard.every(c => c !== '')) {
        statusEl.innerHTML = 'Tabuleiro cheio! Limpando... ✨';
        statusEl.style.color = '#ffaa00';
        statusEl.style.textShadow = '0 0 10px #ffaa00';
        gameActive = false; // trava cliques enquanto limpa

        setTimeout(() => {
          clearBoardAndContinue();
        }, 900);
        return;
      }

      // Troca de jogador
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();

      // Vez da IA
      if (mode === 'ai' && currentPlayer === 'O' && gameActive) {
        setTimeout(aiMove, 450);
      }
    }

    function clearBoardAndContinue() {
      // Apaga todos os X e O, libera os espaços
      gameBoard = ['', '', '', '', '', '', '', '', ''];
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('x', 'o', 'taken', 'win');
      });
      winLine.classList.remove('show');

      // Continua o jogo normalmente
      gameActive = true;
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();

      // Se for a vez da IA, ela joga
      if (mode === 'ai' && currentPlayer === 'O' && gameActive) {
        setTimeout(aiMove, 500);
      }
    }

    function checkWin() {
      for (let i = 0; i < winPatterns.length; i++) {
        const [a, b, c] = winPatterns[i];
        if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
          cells[a].classList.add('win');
          cells[b].classList.add('win');
          cells[c].classList.add('win');

          const s = lineStyles[i];
          winLine.style.top = s.top;
          winLine.style.left = s.left;
          winLine.style.width = s.width;
          winLine.style.transform = s.transform;
          winLine.classList.add('show');
          return true;
        }
      }
      return false;
    }

    function updateScoreDisplay() {
      score1El.textContent = score.X;
      score2El.textContent = score.O;
    }

    function resetRound() {
      gameBoard = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;

      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('x', 'o', 'taken', 'win');
      });
      winLine.classList.remove('show');
      statusEl.classList.remove('win');
      updateStatus();
    }

    function resetScore() {
      score = { X: 0, O: 0 };
      updateScoreDisplay();
      resetRound();
    }

    // ===== INTELIGÊNCIA ARTIFICIAL =====
    function aiMove() {
      if (!gameActive) return;

      // 1. Tentar ganhar
      let move = findBestMove('O');
      if (move === -1) {
        // 2. Bloquear o jogador
        move = findBestMove('X');
      }
      if (move === -1) {
        // 3. Centro
        if (gameBoard[4] === '') move = 4;
      }
      if (move === -1) {
        // 4. Cantos
        const corners = [0, 2, 6, 8].filter(i => gameBoard[i] === '');
        if (corners.length) move = corners[Math.floor(Math.random() * corners.length)];
      }
      if (move === -1) {
        // 5. Qualquer lugar
        const empty = gameBoard.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);
        move = empty[Math.floor(Math.random() * empty.length)];
      }

      if (move !== -1 && move !== undefined) {
        makeMove(move);
      }
    }

    function findBestMove(player) {
      for (let i = 0; i < winPatterns.length; i++) {
        const [a, b, c] = winPatterns[i];
        const line = [gameBoard[a], gameBoard[b], gameBoard[c]];
        const count = line.filter(v => v === player).length;
        const empty = line.filter(v => v === '').length;

        if (count === 2 && empty === 1) {
          if (gameBoard[a] === '') return a;
          if (gameBoard[b] === '') return b;
          if (gameBoard[c] === '') return c;
        }
      }
      return -1;
    }

    // Inicia
    updateLabels();
  </script>
</body>
</html>
